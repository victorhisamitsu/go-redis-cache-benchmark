services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  upstream:
    build: .
    command: ["upstream"]
    environment:
      UPSTREAM_LATENCY: 1500ms
      UPSTREAM_JITTER: 300ms
    ports: ["8081:8081"]

  api:
    build: .
    command: ["api"]
    environment:
      UPSTREAM_URL: http://upstream:8081
      REDIS_ADDR: redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    ports: ["8080:8080"]
    depends_on: [redis, upstream]

  bench:
    build: .
    profiles: ["bench"]
    entrypoint: ["bench", "-api", "http://api:8080", "-upstream", "http://upstream:8081"]
    command: ["-n", "2000", "-c", "50", "-keys", "500"]
